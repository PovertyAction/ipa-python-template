# docs: https://github.com/DavidAnson/markdownlint/blob/v0.32.1/README.md

# default to true for all rules
default: true

# MD007/unordered-list-indent
MD007:
  indent: 2

# MD033/no-inline-html
MD033: false

# MD041/first-line-h1
MD041: false

# MD013/line-length
MD013: false

# MD024/no-duplicate-heading
MD024:
  # Allow when nested under different parents e.g. CHANGELOG.md
  siblings_only: true

MD038: false

# MD060/table-column-style
# Disabled: emoji columns have inconsistent display width vs character
# count, making "aligned" pipe style unachievable by hand.
MD060: false
